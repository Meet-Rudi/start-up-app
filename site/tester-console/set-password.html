<!DOCTYPE html>
<html lang="nl-BE">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex,nofollow" />
<title>Meet Rudi — set your password</title>
<link rel="stylesheet" href="rudi.css" />
</head>
<body>
<div class="center">
  <div class="card tight">
    <div class="brandrow"><div class="brandlogo">R</div>
      <div><span class="lbl" id="eyebrow"></span><h2 id="title"></h2></div></div>
    <p class="hint" id="lead" style="margin-bottom:1.25rem"></p>
    <div class="banner" id="banner" hidden></div>

    <form id="form" novalidate>
      <div class="field">
        <label for="pw1" data-t="pw.password"></label>
        <input id="pw1" type="password" autocomplete="new-password" required />
      </div>
      <div class="rules" id="rules">
        <span class="rule" data-r="len"><span class="mk">✓</span><span data-t="pw.rule.len"></span></span>
        <span class="rule" data-r="low"><span class="mk">✓</span><span data-t="pw.rule.low"></span></span>
        <span class="rule" data-r="up"><span class="mk">✓</span><span data-t="pw.rule.up"></span></span>
        <span class="rule" data-r="dig"><span class="mk">✓</span><span data-t="pw.rule.dig"></span></span>
      </div>
      <div class="field" style="margin-top:1.1rem">
        <label for="pw2" data-t="pw.repeat"></label>
        <input id="pw2" type="password" autocomplete="new-password" required />
        <span class="msg" id="match"></span>
      </div>
      <button class="btn block" id="submit" type="submit" data-t="pw.submit" disabled></button>
    </form>

    <!-- Shown instead of the form when the link is dead. A bare error with the form hidden
         leaves the tester with nothing to do; this explains the most likely cause (they signed
         up twice and opened the older mail) and gives them the way out. -->
    <div id="dead" hidden style="display:flex;flex-direction:column;gap:.9rem">
      <p class="hint" data-t="pw.expired.why"></p>
      <a class="btn block" href="register.html"
         style="display:block;text-align:center;text-decoration:none" data-t="pw.again"></a>
      <p class="hint" id="dead-support"></p>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="rudi.js"></script>
<script>
(function () {
  "use strict";
  var R = window.Rudi, $ = R.$;

  var token = R.param("t");
  var isReset = R.param("mode") === "reset";

  // Mirrors the server's _PASSWORD_RE exactly. The server is the authority — this only tells the
  // tester where they stand before they submit.
  var TESTS = {
    len: function (v) { return v.length >= 8; },
    low: function (v) { return /[a-z]/.test(v); },
    up: function (v) { return /[A-Z]/.test(v); },
    dig: function (v) { return /\d/.test(v); }
  };

  R.applyStrings();
  $("#title").textContent = R.t(isReset ? "pw.title.reset" : "pw.title");
  $("#lead").textContent = R.t("pw.lead");
  $("#eyebrow").textContent = isReset ? "" : R.t("pw.verified");
  $("#eyebrow").style.color = "var(--ok)";
  document.title = $("#title").textContent;

  // One place that turns a dead link into an explained state, used by both the "no token in the
  // URL" case and a server-side rejection.
  function linkIsDead(message) {
    R.banner($("#banner"), "bad", message || R.t("pw.expired"));
    $("#form").hidden = true;
    $("#dead").hidden = false;
    // The "Email verified ✓" badge is set optimistically on load. Leaving it above a
    // "this link no longer works" error tells the tester two contradictory things at once.
    $("#eyebrow").textContent = "";
    $("#lead").textContent = "";
    var support = R.CFG.SUPPORT_EMAIL;
    if (support) {
      $("#dead-support").innerHTML = '<a href="mailto:' + support + '">' + support + "</a>";
    }
  }

  if (!token) linkIsDead();

  function check() {
    var v = $("#pw1").value, passed = 0;
    R.$$("#rules .rule").forEach(function (row) {
      var ok = TESTS[row.dataset.r](v);
      row.classList.toggle("pass", ok);
      if (ok) passed++;
    });
    var same = $("#pw2").value.length > 0 && $("#pw1").value === $("#pw2").value;
    var m = $("#match");
    m.className = "msg " + (same ? "good" : "bad");
    m.textContent = $("#pw2").value.length === 0 ? "" : R.t(same ? "pw.match" : "pw.nomatch");
    $("#submit").disabled = !(passed === 4 && same);
  }
  ["#pw1", "#pw2"].forEach(function (s) { $(s).addEventListener("input", check); });
  check();

  $("#form").addEventListener("submit", function (e) {
    e.preventDefault();
    var btn = $("#submit");
    btn.disabled = true;
    btn.textContent = R.t("app.loading");
    R.api("POST", "/set-password", {
      token: token, password: $("#pw1").value, mode: isReset ? "reset" : "verify"
    }).then(function (res) {
      btn.textContent = R.t("pw.submit");
      if (res.ok && res.data.session) {
        // Setting a password signs you straight in, so the tester lands in the console rather
        // than being asked for the credential they just chose.
        R.setToken(res.data.session);
        location.href = "console.html";
        return;
      }
      btn.disabled = false;
      if (res.data && (res.data.error === "expired" || res.data.error === "invalid")) {
        linkIsDead(R.errorText(res));
        return;
      }
      R.banner($("#banner"), "bad", R.errorText(res));
    });
  });
})();
</script>
</body>
</html>
