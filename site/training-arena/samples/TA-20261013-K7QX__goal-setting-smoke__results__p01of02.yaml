# =================================================================================================
#  Rudi Training Arena — batch RESULTS                            format: rudi-arena/results@1
# -------------------------------------------------------------------------------------------------
#  One YAML stream: a PART HEADER document, then ONE DOCUMENT PER TEST CASE (input order).
#  A results file is split into parts when it nears the token budget (default 450k estimated
#  tokens, always under 500k). A case is NEVER cut across parts — each part holds whole cases.
#  Parts are planned once the last case has finished, from the size each case recorded when it
#  finished, so the "of N" is final and no copy of the results is ever held in memory.
#  Every part repeats the batch summary, so any single part can be read on its own.
#
#  Costs are in euro: what the model providers bill for each call (from the token counts they
#  report and each cascade entry's price) plus the AWS overhead at its configured unit price.
#
#  DUMMY EXAMPLE — conversations are illustrative, not real Rudi output. This 7-case batch is
#  split after case 4 only so the split is visible; a real batch this small fits in one part.
# =================================================================================================

format: rudi-arena/results@1

