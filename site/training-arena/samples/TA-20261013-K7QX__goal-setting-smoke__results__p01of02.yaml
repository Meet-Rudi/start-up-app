  outcomes:                              # the cases in THIS part, in input order
    - {case: TA-20261013-K7QX-0001, key: en-happy-path-walk, outcome: success, stop: script_end, cost_eur: 0.00465}
    - {case: TA-20261013-K7QX-0002, key: en-commit-then-next-day, outcome: success, stop: script_end, cost_eur: 0.00340}
