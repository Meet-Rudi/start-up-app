AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  MEET_RUDI platform database migrations (decision #42). meetrudi-internal-prod-db-migrate applies
  db/migrations to the PlanetScale Vitess (MySQL 8) database (decision #46). Invoke-only: run it
  with `python db/migrate.py <check|plan|apply>`. Uses the console-made meetrudi-lambda-runner
  role, which may read meetrudi* secrets; no IAM resources here.

Parameters:
  Release:
    Type: String
    Default: ""
    Description: Git commit of this deploy, recorded with every applied migration.
  # Where the database is, for secrets that hold only a user and a password. Set from
  # deploy.local.json (planetscale_host, planetscale_port, planetscale_database).
  DbHost:
    Type: String
    Default: ""
  DbPort:
    Type: String
    Default: "3306"
  # The PlanetScale database's name (on Vitess, the keyspace the branch serves).
  DbName:
    Type: String
    Default: ""

Resources:

  # PyMySQL, certifi, packages/rudi_platform and a copy of db/migrations (at /opt/migrations),
  # assembled by build_layer.py before `sam build`.
  DepsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: meetrudi-internal-prod-db-migrate-deps
      Description: MySQL driver, CA bundle, migration runner and the migrations it applies.
      ContentUri: layer/
      CompatibleRuntimes:
        - python3.12
      RetentionPolicy: Delete

  MigrateLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/meetrudi-internal-prod-db-migrate
      RetentionInDays: 30

  MigrateFunction:
    Type: AWS::Serverless::Function
    DependsOn: MigrateLogGroup
    Properties:
      FunctionName: meetrudi-internal-prod-db-migrate
      Description: Applies db/migrations to the platform database (check, plan, apply).
      Runtime: python3.12
      Handler: handler.handler
      CodeUri: src/
      # Well inside the 13-minute rule; each statement is also capped at 120 s by the runner.
      Timeout: 300
      MemorySize: 256
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/meetrudi-lambda-runner"
      Layers:
        - !Ref DepsLayer
      Environment:
        Variables:
          # Secret names as created in Secrets Manager (they predate the meetrudi/{plane}/{stage}
          # convention). `apply` uses the write secret, whose password needs PlanetScale's Admin
          # role to change the schema; `plan` only reads, with the read secret; `check` connects
          # with all three.
          DB_SECRET: meetrudi/planetscale-backbone/primary-main-write
          DB_PLAN_SECRET: meetrudi/planetscale-backbone/primary-main-read
          DB_CHECK_SECRETS: >-
            meetrudi/planetscale-backbone/primary-main-write,meetrudi/planetscale-backbone/primary-main-read,meetrudi/planetscale-backbone/replica-main-read
          MIGRATIONS_DIR: /opt/migrations
          DB_HOST: !Ref DbHost
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          RELEASE: !Ref Release
      Tags:
        env: prod
        service: db-migrate
        cost-center: platform

Outputs:
  FunctionName:
    Description: Invoke with python db/migrate.py <check|plan|apply>
    Value: !Ref MigrateFunction
